<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 320"
  width="1200"
  height="320"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Hello, I'm Luca.</title>
  <desc id="description">An animated introduction on a GitHub-dark background.</desc>

  <style>
    .eyebrow {
      fill: #8b949e;
      font: 600 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 5px;
      animation: rise-in 0.7s 1.1s ease-out both;
    }

    .greeting {
      fill: #f0f6fc;
      font: 650 104px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -5px;
      animation: rise-in 1s 0.1s cubic-bezier(.16, 1, .3, 1) both;
    }

    .rule {
      stroke: #30363d;
      stroke-width: 2;
      stroke-dasharray: 1080;
      animation: draw-line 1.1s 0.65s cubic-bezier(.16, 1, .3, 1) both;
    }

    .cursor {
      fill: #f0f6fc;
      animation: blink 1s 1.25s steps(1, end) infinite;
    }

    @keyframes rise-in {
      0% { opacity: 0; transform: translateY(28px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw-line {
      0% { stroke-dashoffset: 1080; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .eyebrow, .greeting, .rule, .cursor { animation: none; }
      .cursor { display: none; }
    }
  </style>

  <rect width="1200" height="320" fill="#0d1117" />
  <text class="eyebrow" x="60" y="70">WELCOME</text>
  <text class="greeting" x="54" y="205">Hello, I’m Luca.</text>
  <rect class="cursor" x="958" y="120" width="8" height="92" rx="4" />
  <line class="rule" x1="60" y1="270" x2="1140" y2="270" />
</svg>
